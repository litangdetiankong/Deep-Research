<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Deep-Research</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f7f7f8;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #111827;
      color: #fff;
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    #refreshHistory {
      width: 100%;
      margin: 0 0 12px;
      padding: 8px;
      cursor: pointer;
    }

    #historyList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #historyList li {
      margin-bottom: 8px;
    }

    #historyList button {
      width: 100%;
      text-align: left;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.4;
    }

    #historyList button:hover {
      background: #374151;
    }

    #historyList button.active {
      outline: 2px solid #60a5fa;
    }

    .main {
      flex: 1;
      padding: 24px;
      max-width: 960px;
    }

    textarea, #btn {
      width: 100%;
      font-size: 16px;
    }

    textarea {
      height: 100px;
    }

    #btn {
      margin-top: 12px;
      padding: 10px;
      cursor: pointer;
    }

    #toggleRaw {
      margin: 8px 0 12px;
      padding: 6px 10px;
      cursor: pointer;
    }

    pre {
      background: #fff;
      padding: 12px;
      white-space: pre-wrap;
      border: 1px solid #e5e7eb;
    }

    #report {
      background: #fff;
      border: 1px solid #e5e7eb;
      padding: 16px 20px;
      min-height: 200px;
      line-height: 1.7;
      overflow-x: auto;
    }

    #report h1, #report h2, #report h3 {
      margin: 1.2em 0 0.6em;
      line-height: 1.3;
    }

    #report p, #report li {
      margin: 0.5em 0;
    }

    #report ul, #report ol {
      padding-left: 1.4em;
    }

    #report table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 14px;
    }

    #report th, #report td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      vertical-align: top;
    }

    #report th {
      background: #f3f4f6;
    }

    #report code {
      background: #f3f4f6;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; max-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>历史记录</h2>
      <button id="refreshHistory" type="button">刷新</button>
      <ul id="historyList"></ul>
    </aside>

    <main class="main">
      <h1>Deep-Research</h1>
      <p class="muted">输入技术调研问题，后端会跑 Planner → Search → Writer → Critic</p>

      <textarea id="q" placeholder="请输入研究问题"></textarea>
      <button id="btn" type="button">开始研究</button>
      <p id="status" class="muted"></p>

      <h2>研究计划</h2>
      <pre id="plan"></pre>

      <h2>运行信息</h2>
      <pre id="meta"></pre>

      <h2>研究报告</h2>
      <button id="toggleRaw" type="button">查看原始 Markdown</button>
      <div id="report"></div>
    </main>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const refreshBtn = document.getElementById("refreshHistory");
    const toggleRawBtn = document.getElementById("toggleRaw");
    let showRaw = false;

    function renderReport(md) {
      const el = document.getElementById("report");
      const text = md || "";
      window.__lastReportMd = text;
      if (showRaw || !window.marked) {
        el.textContent = text;
        return;
      }
      el.innerHTML = marked.parse(text);
    }

    function renderDetail(data) {
      document.getElementById("q").value = data.question || "";
      document.getElementById("plan").textContent =
        (data.plan_sub_questions || []).map((x, i) => `${i + 1}. ${x}`).join("\n");
      document.getElementById("meta").textContent =
        `research_id: ${data.research_id || ""}\n` +
        `evidence_count: ${data.evidence_count ?? ""}\n` +
        `retry_count: ${data.retry_count ?? ""}\n` +
        `report_path: ${data.report_path || ""}`;
      showRaw = false;
      toggleRawBtn.textContent = "查看原始 Markdown";
      renderReport(data.report_md);
    }

    async function loadHistory() {
      const resp = await fetch("/history?limit=20");
      const data = await resp.json();
      const ul = document.getElementById("historyList");
      ul.innerHTML = "";

      (data.items || []).forEach((item) => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        const title = (item.question || "").slice(0, 36);
        b.textContent = `${title}${(item.question || "").length > 36 ? "..." : ""}`;
        b.title = item.question || "";
        b.onclick = async () => {
          document.querySelectorAll("#historyList button").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");

          const r = await fetch(`/history/${item.research_id}`);
          const detail = await r.json();
          if (!r.ok) {
            document.getElementById("status").textContent = "载入历史失败";
            return;
          }
          renderDetail(detail);
          document.getElementById("status").textContent = "已载入历史记录";
        };
        li.appendChild(b);
        ul.appendChild(li);
      });
    }

    btn.onclick = async () => {
      const question = document.getElementById("q").value.trim();
      if (!question) {
        alert("请输入问题");
        return;
      }

      document.getElementById("status").textContent = "运行中，请稍候（可能需要几十秒）...";
      btn.disabled = true;

      try {
        const resp = await fetch("/research", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, max_rounds: 2 }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
        }

        renderDetail(data);
        document.getElementById("status").textContent = "完成";
        await loadHistory();
      } catch (e) {
        document.getElementById("status").textContent = "失败：" + e.message;
      } finally {
        btn.disabled = false;
      }
    };

    toggleRawBtn.onclick = () => {
      showRaw = !showRaw;
      toggleRawBtn.textContent = showRaw ? "查看渲染结果" : "查看原始 Markdown";
      renderReport(window.__lastReportMd || "");
    };

    refreshBtn.onclick = loadHistory;
    loadHistory();
  </script>
</body>
</html>
